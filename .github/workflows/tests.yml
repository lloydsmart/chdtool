name: Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "chdtool.sh"
      - "Makefile"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "chdtool.sh"
      - "Makefile"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/tests.yml"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install test deps
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip make

      - name: Run tests
        run: make test

      - name: Upload logs from tests (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-from-tests
          path: logs/
          if-no-files-found: ignore
