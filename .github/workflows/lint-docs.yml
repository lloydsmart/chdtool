name: Lint Docs

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - ".github/workflows/lint-docs.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - ".github/workflows/lint-docs.yml"

concurrency:
  group: lint-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  markdownlint:
    name: Lint Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          # Changelogs are generated by git-cliff.
          globs: |
            **/*.md
            #CHANGELOG.md
            #CHANGELOG_RELEASE.md
